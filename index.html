<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>

  <!-- ILAGAY ANG LAHAT NG CSS CODE MO RITO -->
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #3a7bd5, #3a6073);
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    h2 {
      margin: 0 0 20px 0;
      color: #1e293b;
    }

    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #3b82f6;
    }

    button {
      padding: 10px 16px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    .weather-info {
      display: none;
      animation: fadeIn 0.3s ease-in;
    }

    .city-name {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
    }

    .coords {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 16px;
    }

    .temp-container {
      margin: 16px 0;
    }

    .temperature {
      font-size: 54px;
      font-weight: 800;
      color: #1e3a8a;
    }

    .condition {
      font-size: 18px;
      font-weight: 600;
      color: #475569;
      margin-top: 4px;
    }

    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 24px;
      background: #f1f5f9;
      padding: 14px;
      border-radius: 12px;
    }

    .detail-item {
      display: flex;
      flex-direction: column;
    }

    .detail-label {
      font-size: 12px;
      color: #64748b;
      text-transform: uppercase;
    }

    .detail-val {
      font-size: 16px;
      font-weight: 700;
      color: #1e293b;
      margin-top: 4px;
    }

    .error {
      color: #dc2626;
      font-size: 14px;
      margin-top: 10px;
      display: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Weather App 🌤️</h2>

    <div class="search-box">
      <input type="text" id="city-input" placeholder="Enter city name..." value="Manila">
      <button id="search-btn">Search</button>
    </div>

    <div id="error-msg" class="error">City not found. Try another city.</div>

    <div id="weather-info" class="weather-info">
      <div class="city-name" id="city-display">--</div>
      <div class="coords" id="coords-display">Lat: -- | Lon: --</div>

      <div class="temp-container">
        <div class="temperature" id="temp-display">--°C</div>
        <div class="condition" id="condition-display">--</div>
      </div>

      <div class="details">
        <div class="detail-item">
          <span class="detail-label">Wind Speed</span>
          <span class="detail-val" id="wind-display">-- km/h</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">Humidity</span>
          <span class="detail-val" id="humidity-display">--%</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ILAGAY ANG LAHAT NG JAVASCRIPT CODE MO RITO -->
  <script>
    const weatherCodes = {
      0: "Clear sky ☀️",
      1: "Mainly clear 🌤️",
      2: "Partly cloudy ⛅",
      3: "Overcast ☁️",
      45: "Fog 🌫️",
      48: "Depositing rime fog 🌫️",
      51: "Light drizzle 🌧️",
      53: "Moderate drizzle 🌧️",
      55: "Dense drizzle 🌧️",
      61: "Slight rain 🌧️",
      63: "Moderate rain 🌧️",
      65: "Heavy rain 🌧️",
      71: "Slight snow ❄️",
      73: "Moderate snow ❄️",
      75: "Heavy snow ❄️",
      80: "Slight rain showers 🌦️",
      81: "Moderate rain showers 🌦️",
      82: "Violent rain showers ⛈️",
      95: "Thunderstorm 🌩️",
      96: "Thunderstorm with slight hail ⛈️",
      99: "Thunderstorm with heavy hail ⛈️"
    };

    const searchBtn = document.getElementById('search-btn');
    const cityInput = document.getElementById('city-input');
    const errorMsg = document.getElementById('error-msg');
    const weatherInfo = document.getElementById('weather-info');

    async function getWeather() {
      const query = cityInput.value.trim();
      if (!query) return;

      errorMsg.style.display = 'none';

      try {
        const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=en&format=json`;
        const geoRes = await fetch(geoUrl);
        const geoData = await geoRes.json();

        if (!geoData.results || geoData.results.length === 0) {
          throw new Error('City not found');
        }

        const location = geoData.results[0];
        const { latitude, longitude, name, country } = location;

        const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m`;
        const weatherRes = await fetch(weatherUrl);
        const weatherData = await weatherRes.json();

        const current = weatherData.current;

        document.getElementById('city-display').textContent = `${name}, ${country || ''}`;
        document.getElementById('coords-display').textContent = `Lat: ${latitude.toFixed(2)} | Lon: ${longitude.toFixed(2)}`;
        document.getElementById('temp-display').textContent = `${Math.round(current.temperature_2m)}°C`;
        document.getElementById('condition-display').textContent = weatherCodes[current.weather_code] || "Unknown Condition";
        document.getElementById('wind-display').textContent = `${current.wind_speed_10m} km/h`;
        document.getElementById('humidity-display').textContent = `${current.relative_humidity_2m}%`;

        weatherInfo.style.display = 'block';

      } catch (err) {
        weatherInfo.style.display = 'none';
        errorMsg.style.display = 'block';
      }
    }

    searchBtn.addEventListener('click', getWeather);

    cityInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') getWeather();
    });

    getWeather();
  </script>
</body>
</html>
